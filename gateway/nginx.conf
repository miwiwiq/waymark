# One origin for the whole app (decision A1). Upstreams are resolved per request
# through Docker's DNS, so the gateway starts even while a service is still down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;

  set $auth  http://auth:3000;
  set $users http://users:3000;
  set $posts http://posts:3000;
  set $feed  http://feed:3000;
  set $web   http://web:3000;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Services keep the /api prefix; /internal/* is never forwarded.
  location /api/auth         { proxy_pass $auth; }
  location /api/users        { proxy_pass $users; }
  location /api/posts        { proxy_pass $posts; }
  location /api/feed         { proxy_pass $feed; }
  location /api/interactions { proxy_pass $feed; }
  location /api/             { return 404; }

  location / { proxy_pass $web; }
}
